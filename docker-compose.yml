services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      - ./backend/litellm_config.yaml:/app/config.yaml:ro
    env_file:
      - ./backend/.env
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_db:/app/data
      # Adjust the host-side filename to match your actual .pem file in backend/
      - ./backend/secretscan-ai-test.2026-08-21.private-key.pem:/app/secretscan-ai-test.2026-08-21.private-key.pem:ro
    env_file:
      - ./backend/.env
    environment:
      - SQLALCHEMY_DATABASE_URL=sqlite:////app/data/secret_scan.db
      - GITHUB_PRIVATE_KEY_PATH=secretscan-ai-test.2026-08-21.private-key.pem
    depends_on:
      - litellm

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  backend_db: